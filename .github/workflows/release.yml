name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.14', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:pack
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-release.mjs
  publish:
    needs: [validate, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11.21.0
      - run: node scripts/check-release.mjs
      - run: node scripts/verify-pack.mjs release-artifact
      - name: Publish the verified archive using OIDC
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          test -f "./release-artifact/dns-posture-$version.tgz"
          npm publish "./release-artifact/dns-posture-$version.tgz" --tag "$tag" --provenance
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifact/*.tgz --verify-tag --generate-notes
